# Deploys the static game to GitHub Pages and runs tests/lint as a CI gate.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Give the workflow permission to write to GitHub Pages and fetch an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI gate: the game is only published when the tests and lint pass.
      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/
          cp -r src dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
